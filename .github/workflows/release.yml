# Release the three engine packages (@cognovis/fhir-billing-types, -rules, -engine) to npm.cognovis.de.
# @cognovis/fhir-billing-sdk is published from cognovis/chp since 0.37.1 and never from here.
#
# Triggered by a pushed v<semver> tag, or manually to retry an existing tag.
# The packages are packed once and published through the ccore release guard
# (`ccore release publish-npm`), which checks name, version, registry host
# allow-list and access ring and runs no lifecycle scripts. That is why the
# engine manifest guard (Apache-2.0, no cognovis SDK dependency) runs here as an
# explicit step before packing.
# The same tarballs are then attached to the GitHub release for the tag, with
# the rule-set JSON Schema billing-rule-set.schema.json taken from the packed
# rules archive (cognovis/fhir-billing-core#16).
#
# Two jobs keep the publish credentials away from code the build executes.
# `build` runs the tests, packs once and runs the packed consumers, which
# install the packed archives outside the lockfile; it holds no secret and only
# a read token. `publish` holds NPM_TOKEN and the
# write token, runs no repository or dependency code, and publishes only the
# archives whose sha256 equals the one `build` recorded when it packed them.
#
# The registry is the private Verdaccio on npm.cognovis.de, not the public npm
# registry, so npm provenance attestations do not apply.

name: Release NPM packages

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "release-${{ inputs.release_tag || github.ref_name }}"
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  # The only host the publish job may hand the publish token to.
  RELEASE_REGISTRY_HOST: npm.cognovis.de
  # jq filter of a usable npm dist-tags snapshot: one object of tag -> exact version, with latest.
  VALID_DIST_TAGS: 'type == "object" and length > 0 and (.latest | type == "string") and all(.[]; type == "string" and test("^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$"))'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      types_tarball: ${{ steps.pack.outputs.types_tarball }}
      rules_tarball: ${{ steps.pack.outputs.rules_tarball }}
      engine_tarball: ${{ steps.pack.outputs.engine_tarball }}
      types_sha256: ${{ steps.pack.outputs.types_sha256 }}
      rules_sha256: ${{ steps.pack.outputs.rules_sha256 }}
      engine_sha256: ${{ steps.pack.outputs.engine_sha256 }}
      schema_sha256: ${{ steps.pack.outputs.schema_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      # Node stays only for npm on the latest LTS (toolchains standard, rule 2):
      # `npm ci` installs the package-lock.json workspaces and `npm pack` builds
      # the tarballs. The @cognovis packages resolve anonymously.
      - name: Install verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Verify tag and workspace versions
        run: |
          set -euo pipefail
          release_version=${RELEASE_TAG#v}
          test "$(tr -d '[:space:]' < VERSION)" = "$release_version"
          test "$(jq -r .version package.json)" = "$release_version"
          for manifest in packages/types/package.json packages/rules/package.json packages/engine/package.json; do
            test "$(jq -r .version "$manifest")" = "$release_version"
          done

      - name: Verify publish registry
        run: |
          set -euo pipefail
          for manifest in packages/types/package.json packages/rules/package.json packages/engine/package.json; do
            registry=$(jq -r .publishConfig.registry "$manifest")
            host=${registry#https://}
            test "${host%/}" = "$RELEASE_REGISTRY_HOST"
          done

      # Bun runs the test suite and the engine manifest guard.
      - name: Install Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Verify engine manifests carry no cognovis SDK
        run: npm run check:engine-manifests

      # The archive hashes become step outputs here, before any code outside the
      # lockfile runs; a later step cannot change a finished step's outputs.
      - name: Pack once
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packs"
          for package_name in types rules engine; do
            tarball=$(npm pack --workspace "@cognovis/fhir-billing-$package_name" --json --foreground-scripts=false --pack-destination "$RUNNER_TEMP/packs" | jq -er '.[0].filename')
            test -f "$RUNNER_TEMP/packs/$tarball"
            sha256=$(sha256sum "$RUNNER_TEMP/packs/$tarball" | cut -d' ' -f1)
            printf '%s_tarball=%s\n%s_sha256=%s\n' "$package_name" "$tarball" "$package_name" "$sha256" >> "$GITHUB_OUTPUT"
            if [ "$package_name" = rules ]; then rules_tarball=$tarball; fi
          done
          # The release asset is the schema the rules archive ships, extracted from that archive.
          tar -xOzf "$RUNNER_TEMP/packs/$rules_tarball" package/schema/billing-rule-set.schema.json > "$RUNNER_TEMP/packs/billing-rule-set.schema.json"
          jq -e '."$id" == "https://fhir.cognovis.de/billing-core/schema/billing-rules/v2"' "$RUNNER_TEMP/packs/billing-rule-set.schema.json" > /dev/null
          printf 'schema_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/packs/billing-rule-set.schema.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify the exact packed compatibility matrix
        env:
          TYPES_TARBALL: ${{ steps.pack.outputs.types_tarball }}
          RULES_TARBALL: ${{ steps.pack.outputs.rules_tarball }}
          ENGINE_TARBALL: ${{ steps.pack.outputs.engine_tarball }}
        run: |
          packs="$RUNNER_TEMP/packs"
          bun scripts/catalog-example-guard.mjs "$packs/$TYPES_TARBALL" "$packs/$RULES_TARBALL" "$packs/$ENGINE_TARBALL"
          node scripts/verify-packed-portability.mjs "$packs/$TYPES_TARBALL" "$packs/$RULES_TARBALL" "$packs/$ENGINE_TARBALL"

      - name: Hand the packed archives to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-archives
          path: |
            ${{ runner.temp }}/packs/*.tgz
            ${{ runner.temp }}/packs/billing-rule-set.schema.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The checkout supplies the manifests and the tag for the release; this job runs none of its code.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      # registry-url writes an npmrc that hands NODE_AUTH_TOKEN to this host
      # only; the publish step is the only step that sets NODE_AUTH_TOKEN.
      - name: Install verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          registry-url: https://npm.cognovis.de
          scope: '@cognovis'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest

      - name: Install ccore
        continue-on-error: true
        env:
          UV_INDEX_COGNOVIS_USERNAME: malte
          UV_INDEX_COGNOVIS_PASSWORD: ${{ secrets.PACKAGE_REGISTRY_READ_TOKEN }}
        run: |
          uv tool install \
            --force \
            --refresh \
            --no-build \
            --index cognovis=https://git.cognovis.de/api/packages/cognovis/pypi/simple \
            cognovis-core-tools || true
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Verify ccore publishing capability
        run: ccore release publish-npm --help > /dev/null

      - name: Receive the packed archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-archives
          path: ${{ runner.temp }}/packs

      - name: Verify the archives are the ones the build packed
        env:
          TYPES_FILE: ${{ needs.build.outputs.types_tarball }}
          RULES_FILE: ${{ needs.build.outputs.rules_tarball }}
          ENGINE_FILE: ${{ needs.build.outputs.engine_tarball }}
          TYPES_SHA256: ${{ needs.build.outputs.types_sha256 }}
          RULES_SHA256: ${{ needs.build.outputs.rules_sha256 }}
          ENGINE_SHA256: ${{ needs.build.outputs.engine_sha256 }}
          SCHEMA_SHA256: ${{ needs.build.outputs.schema_sha256 }}
        run: |
          set -euo pipefail
          packs="$RUNNER_TEMP/packs"
          TYPES_TARBALL="$packs/$TYPES_FILE" RULES_TARBALL="$packs/$RULES_FILE" ENGINE_TARBALL="$packs/$ENGINE_FILE"
          SCHEMA_FILE="$packs/billing-rule-set.schema.json"
          test -n "$SCHEMA_SHA256"
          printf '%s  %s\n' \
            "$TYPES_SHA256" "$TYPES_TARBALL" \
            "$RULES_SHA256" "$RULES_TARBALL" \
            "$ENGINE_SHA256" "$ENGINE_TARBALL" \
            "$SCHEMA_SHA256" "$SCHEMA_FILE" | sha256sum --check --strict
          # The schema asset is byte-identical to the one inside the verified rules archive.
          tar -xOzf "$RULES_TARBALL" package/schema/billing-rule-set.schema.json | cmp - "$SCHEMA_FILE"
          test "$(find "$packs" -type f | wc -l)" = 4
          printf 'TYPES_TARBALL=%s\nRULES_TARBALL=%s\nENGINE_TARBALL=%s\nSCHEMA_FILE=%s\n' "$TYPES_TARBALL" "$RULES_TARBALL" "$ENGINE_TARBALL" "$SCHEMA_FILE" >> "$GITHUB_ENV"

      - name: Verify explicit immutable publication tag
        run: |
          set -euo pipefail
          release_version=${RELEASE_TAG#v}
          dist_tag=$(jq -er '.publishConfig.tag' packages/engine/package.json)
          case "$dist_tag" in
            *"-${release_version//./-}") ;;
            *) echo "::error::An explicit per-version npm tag is required."; exit 1 ;;
          esac
          for package_name in types rules engine; do
            manifest="packages/$package_name/package.json"
            test "$(jq -er '.publishConfig.tag' "$manifest")" = "$dist_tag"
            npm view "@cognovis/fhir-billing-$package_name" dist-tags --json --prefer-online --registry=https://npm.cognovis.de > "$RUNNER_TEMP/$package_name-tags-before.json"
            # A usable snapshot is one JSON object of tag -> exact version with a latest entry; anything else stops before publishing.
            jq -e "$VALID_DIST_TAGS" "$RUNNER_TEMP/$package_name-tags-before.json" > /dev/null
            mapped_version=$(jq -r --arg tag "$dist_tag" '.[$tag] // empty' "$RUNNER_TEMP/$package_name-tags-before.json")
            test -z "$mapped_version" || test "$mapped_version" = "$release_version"
          done
          printf 'NPM_DIST_TAG=%s\n' "$dist_tag" >> "$GITHUB_ENV"

      - name: Publish packages through the ccore guard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::The NPM_TOKEN secret for npm.cognovis.de is required."; exit 1; }
          publish_package() {
            package_name=$1
            tarball=$2
            guard_root="$RUNNER_TEMP/ccore-$package_name"
            mkdir -p "$guard_root"
            cp "packages/$package_name/package.json" "$guard_root/package.json"
            git -C "$guard_root" init --quiet
            (cd "$guard_root" && ccore release publish-npm "$tarball" --tag "$NPM_DIST_TAG")
          }
          publish_package types "$TYPES_TARBALL"
          publish_package rules "$RULES_TARBALL"
          publish_package engine "$ENGINE_TARBALL"

      - name: Verify previous npm pointers are unchanged
        run: |
          set -euo pipefail
          release_version=${RELEASE_TAG#v}
          for package_name in types rules engine; do
            npm view "@cognovis/fhir-billing-$package_name" dist-tags --json --prefer-online --registry=https://npm.cognovis.de > "$RUNNER_TEMP/$package_name-tags-after.json"
            jq -e "$VALID_DIST_TAGS" "$RUNNER_TEMP/$package_name-tags-after.json" > /dev/null
            test "$(jq -er --arg tag "$NPM_DIST_TAG" '.[$tag]' "$RUNNER_TEMP/$package_name-tags-after.json")" = "$release_version"
            before=$(jq -Sc --arg tag "$NPM_DIST_TAG" 'del(.[$tag])' "$RUNNER_TEMP/$package_name-tags-before.json")
            after=$(jq -Sc --arg tag "$NPM_DIST_TAG" 'del(.[$tag])' "$RUNNER_TEMP/$package_name-tags-after.json")
            test "$before" = "$after"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          previous_latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --latest=false \
            --target "$release_sha" \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG" \
            "$TYPES_TARBALL" "$RULES_TARBALL" "$ENGINE_TARBALL" "$SCHEMA_FILE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)" = "$previous_latest"
